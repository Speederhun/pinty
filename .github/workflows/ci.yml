name: CI
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=linux --project-name pinty .
      - run: rm -f test/widget_test.dart   # a flutter create által generált minta-teszt
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # A tesztek után kész linux/amd64 binárist publikál (a kis lemezű szerveren így nem kell fordítani).
  release:
    needs: server
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        working-directory: server
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../pinty-server-linux-amd64 .
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete server-latest --cleanup-tag -y || true
          gh release create server-latest pinty-server-linux-amd64 \
            --prerelease --target "${{ github.sha }}" \
            --title "Szerver (legfrissebb)" \
            --notes "Automatikusan épített linux/amd64 szerver. Commit: ${{ github.sha }}"
