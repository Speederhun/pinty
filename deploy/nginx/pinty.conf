# Másold a /etc/nginx/sites-available/ alá, majd:
#   sudo ln -s /etc/nginx/sites-available/pinty.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vault.kryptone-intel.tech      # HTTPS tanúsítvány
server {
    listen 80;
    server_name vault.kryptone-intel.tech;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        # A szerver az első X-Forwarded-For elemet tekinti a kliens címének,
        # ezért itt felülírjuk (nem hozzáfűzzük), hogy a kliens ne hamisíthassa.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
