publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.3
  http: ^1.2.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  flutter_markdown: ^0.7.4+1
  markdown: ^7.1.1
  flutter_highlight: ^0.7.0
  file_picker: ^10.3.8
  url_launcher: ^6.3.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
